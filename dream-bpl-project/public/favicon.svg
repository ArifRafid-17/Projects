<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Sun Radial Gradient -->
    <radialGradient id="sunGradient" cx="50%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#FED136" />
      <stop offset="70%" stop-color="#F37023" />
      <stop offset="100%" stop-color="#D9411E" />
    </radialGradient>

    <!-- Bat Wood Gradient -->
    <linearGradient id="batGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5A624" />
      <stop offset="100%" stop-color="#FFDD55" />
    </linearGradient>

    <clipPath id="circleClip">
      <circle cx="50" cy="54" r="28" />
    </clipPath>
  </defs>

  <!-- Circular Sun Backdrop -->
  <g clip-path="url(#circleClip)">
    <circle cx="50" cy="54" r="28" fill="url(#sunGradient)" stroke="#111638" stroke-width="4" />
    <!-- Distant ground silhouette inside sun -->
    <path d="M20 71 Q 50 67 80 71 L80 85 L20 85 Z" fill="#111638" />
  </g>
  <!-- Sun Outer Stroke Rim -->
  <circle cx="50" cy="54" r="28" fill="none" stroke="#111638" stroke-width="3.5" />

  <!-- Cricket Bat -->
  <!-- Handle -->
  <path d="M64 21 L69 14 L72 16 L67 23 Z" fill="#FFFFFF" stroke="#111638" stroke-width="1.2" stroke-linejoin="round" />
  <!-- Grip / Rubber -->
  <path d="M62 24 L65 20 L68 22 L65 26 Z" fill="#E83A25" stroke="#111638" stroke-width="1.2" />
  <!-- Blade -->
  <path d="M68 18 L79 6 C82 3 85 6 83 9 L72 26 L65 21 Z" fill="url(#batGradient)" stroke="#111638" stroke-width="1.6" stroke-linejoin="round" />
  <!-- Inner Bat Highlight line -->
  <path d="M70 17 L78 8" stroke="#FFFFFF" stroke-width="0.8" stroke-linecap="round" />

  <!-- Batsman Figure -->
  <g id="batsman">
    <!-- Back Leg & Thigh (Leading right leg in shot) -->
    <path d="M50 45 C58 48 64 57 66 69 C63 71 58 68 56 63 C53 58 49 53 47 48 Z" fill="#1A2046" stroke="#111638" stroke-width="1.5" stroke-linejoin="round" />
    <!-- Back Foot/Pad -->
    <path d="M64 66 L69 66 C71 69 67 73 63 73 C61 73 62 69 64 66 Z" fill="#FFFFFF" stroke="#111638" stroke-width="1.2" />

    <!-- Front Leg (Bent front knee) -->
    <path d="M42 45 C46 51 47 57 44 65 C41 71 36 74 34 74 C34 70 36 62 38 54 C39 48 40 46 42 45 Z" fill="#1A2046" stroke="#111638" stroke-width="1.5" stroke-linejoin="round" />
    <!-- Front Pad Details / Shin Guard -->
    <path d="M43 56 C44 62 43 68 41 73 L35 73 C37 67 38 60 38 55 Z" fill="#242C5D" stroke="#111638" stroke-width="1.2" />
    <path d="M37 60 L42 61 M36 65 L41 66 M35 70 L40 70" stroke="#FFFFFF" stroke-width="0.8" stroke-linecap="round" />
    <!-- Front Shoe -->
    <path d="M41 72 L44 74 L33 74 C31 74 32 72 35 72 Z" fill="#FFFFFF" stroke="#111638" stroke-width="1.2" />

    <!-- Torso / Jersey -->
    <path d="M34 26 C40 23 49 24 53 28 C56 32 58 40 54 47 C48 53 40 50 36 44 C33 39 33 32 34 26 Z" fill="#1A2046" stroke="#111638" stroke-width="1.5" stroke-linejoin="round" />
    <!-- Red Accent / Shoulder & Collar Stripes -->
    <path d="M41 24 C45 23 49 25 50 28 L46 30 C44 27 42 26 39 26 Z" fill="#E83A25" stroke="#111638" stroke-width="1" />
    <path d="M39 31 C43 32 51 34 54 36 L52 40 C48 37 42 35 37 34 Z" fill="#E83A25" stroke="#111638" stroke-width="1" />

    <!-- Rear Arm & Glove -->
    <path d="M51 27 C56 26 62 26 64 24 L63 21 C59 22 54 23 49 25 Z" fill="#1A2046" stroke="#111638" stroke-width="1.2" />
    <circle cx="64" cy="21" r="3.2" fill="#FFFFFF" stroke="#111638" stroke-width="1.2" />

    <!-- Front Arm & Glove -->
    <path d="M36 29 C34 32 32 35 34 37 C38 39 52 35 60 26 L57 23 C50 30 40 33 37 30 Z" fill="#E83A25" stroke="#111638" stroke-width="1.3" stroke-linejoin="round" />
    <circle cx="60" cy="26" r="3.4" fill="#FFFFFF" stroke="#111638" stroke-width="1.3" />

    <!-- Head & Helmet -->
    <ellipse cx="38" cy="14" rx="7.5" ry="6.5" fill="#1A2046" stroke="#111638" stroke-width="1.4" />
    <!-- Helmet Visor / Grille -->
    <path d="M30 16 L38 18 L38 21 C33 21 31 18 30 16 Z" fill="#FFFFFF" stroke="#111638" stroke-width="1" />
    <path d="M34 18 L34 21 M36 18 L36 21" stroke="#111638" stroke-width="0.8" />
    <!-- Peak of Helmet -->
    <path d="M28 17 C31 14 36 14 39 15 L36 12 C32 12 29 14 28 17 Z" fill="#111638" />
    <!-- Ear Guard -->
    <circle cx="41" cy="15" r="2" fill="#FED136" stroke="#111638" stroke-width="1" />
  </g>

  <!-- Bottom Arch Banner -->
  <path d="M4 80 Q 50 72 96 80 L98 83 Q 50 75 2 83 Z" fill="#111638" />
  <path d="M2 96 Q 50 88 98 96 L96 98 Q 50 91 4 98 Z" fill="#111638" />

  <!-- "CRICKET" Text -->
  <text 
    x="50" 
    y="89" 
    font-family="'Arial Black', 'Impact', sans-serif" 
    font-size="9" 
    font-weight="900" 
    letter-spacing="3.5" 
    fill="#1A2046" 
    text-anchor="middle"
    alignment-baseline="middle"
  >
    CRICKET
  </text>
</svg>
